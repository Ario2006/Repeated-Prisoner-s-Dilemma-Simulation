<path d="M126 168 L150 190 L124 188Z M174 168 L150 190 L176 188Z" fill="#fff" stroke="#111" stroke-width="3.5"/></g>
<g id="tie"><path d="M143 190 L157 190 L152 203 L148 203Z M148 203 L152 203 L163 258 L150 278 L137 258Z" fill="#4aa3df" stroke="#111" stroke-width="3.5"/><path d="M148 215 L144 250 M154 220 L151 255" stroke="#fff" stroke-width="2" opacity=".6" fill="none"/></g>
<g id="body-prop"></g>
<g id="armL" transform="rotate(38 104 184)"><g class="swing" style="transform-origin:104px 184px;--d:1"><path d="M104 184 Q84 235 90 282" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/><ellipse cx="102" cy="290" rx="7" ry="10" fill="#fff" stroke="#111" stroke-width="3.5"/><ellipse cx="90" cy="298" rx="16" ry="19" fill="#fff" stroke="#111" stroke-width="4"/><rect x="76" y="238" width="22" height="9" rx="2" fill="#f5e6c8" stroke="#111" stroke-width="2.5" transform="rotate(-12 87 242)"/></g></g><g id="armR" transform="rotate(-38 196 184)"><g class="swing" style="transform-origin:196px 184px;--d:-1"><path d="M196 184 Q216 235 210 282" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/><ellipse cx="198" cy="290" rx="7" ry="10" fill="#fff" stroke="#111" stroke-width="3.5"/><ellipse cx="210" cy="298" rx="16" ry="19" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="210" cy="322" r="13" fill="#e0a526" stroke="#111" stroke-width="3"/><circle cx="210" cy="322" r="7" fill="none" stroke="#111" stroke-width="2"/></g></g>
<g id="head" class="head"><circle cx="150" cy="100" r="62" fill="#fff" stroke="#111" stroke-width="5"/>
