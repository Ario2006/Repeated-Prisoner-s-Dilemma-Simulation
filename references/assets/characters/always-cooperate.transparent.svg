<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500" stroke-linejoin="round" stroke-linecap="round">
<style>.bob{animation:bob 2.4s ease-in-out infinite}.bobFast{animation:bob .7s ease-in-out infinite}.float{animation:float 3s ease-in-out infinite}
.swing{animation:swing 2s ease-in-out infinite}.wave{animation:wave .9s ease-in-out infinite}.jab{animation:jab 1s ease-in-out infinite}
.head{transform-origin:150px 165px;animation:tilt 3.4s ease-in-out infinite}.blink{transform-origin:150px 100px;animation:blink 4s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes float{50%{transform:translateY(-10px)}}
@keyframes swing{50%{transform:rotate(calc(var(--d)*10deg))}}@keyframes wave{50%{transform:rotate(calc(var(--d)*-22deg))}}
@keyframes jab{50%{transform:rotate(-10deg)}}@keyframes tilt{50%{transform:rotate(-4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}</style>

<path id="shadow" d="M58 460 l22 -14 M82 460 l22 -14 M106 460 l22 -14 M130 460 l22 -14 M154 460 l22 -14 M178 460 l22 -14 M202 460 l22 -14 M226 460 l22 -14 " stroke="#e0a526" stroke-width="4" fill="none" opacity=".85"/>
<g id="always-cooperate" class="bob">

